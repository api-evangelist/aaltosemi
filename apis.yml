aid: aaltosemi
name: Aaltosemi
description: 'AaltoSemi (Chinese name 芯爱科技（南京）有限公司) is an integrated-circuit
  packaging substrate manufacturer founded on 8 May 2021 and headquartered in the Pukou
  Economic Development Zone in Nanjing, Jiangsu, China. The company designs and fabricates
  the organic substrates that carry the electrical connection between a semiconductor die
  and the printed circuit board, covering both BT and ABF material systems across Coreless,
  ETS, FCCSP, FCBGA (BT) and FCBGA (ABF) product families for consumer electronics,
  high-performance computing, communications, automotive and medical applications, and it
  offers those as an end-to-end service spanning R&D, design, production and test. Its
  Nanjing fab is a high-automation plant with a stated annual capacity of roughly 1.45
  million substrate panels, and the company holds IATF 16949 and VDA 6.3 quality
  certifications and has filed more than twenty patents since founding. The name is taken
  from the Finnish designer Alvar Aalto. AaltoSemi is a hardware manufacturer: it sells
  physical substrates to chip makers and OSATs, and it publishes no public API, developer
  portal, SDK or machine-readable contract of any kind.'
